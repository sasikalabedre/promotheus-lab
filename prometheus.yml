global:
  scrape_interval: 15s

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: ubuntu-host
    static_configs:
      - targets: ['192.168.1.3:9100']
        labels:
          env: lab
          os: ubuntu

  - job_name: metrics-app
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: kube-state-metrics
    static_configs:
      - targets: ['host.docker.internal:8082']
